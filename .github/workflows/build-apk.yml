name: Auto Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Dependencies & Build Web
      run: |
        # 自动寻找包含 package.json 的目录并进入
        if [ -f "package.json" ]; then
          npm install
          npm run build || true
        elif [ -d "proraw-app" ] && [ -f "proraw-app/package.json" ]; then
          cd proraw-app
          npm install
          npm run build || true
        else
          echo "Looking for package.json..."
          find . -name "package.json"
        fi

    - name: Setup Android SDK and Gradle Resolution
      run: |
        # 寻找 android 目录并配置统一的 Kotlin 版本
        ANDROID_DIR="android"
        if [ ! -d "$ANDROID_DIR" ]; then
          ANDROID_DIR=$(find . -type d -name "android" | head -n 1)
        fi
        cd "$ANDROID_DIR"
        
        mkdir -p ~/.gradle/init.d
        cat << 'EOF' > ~/.gradle/init.d/kotlin-fix.gradle
        allprojects {
            configurations.all {
                resolutionStrategy.eachDependency { details ->
                    if (details.requested.group == 'org.jetbrains.kotlin') {
                        details.useVersion '1.8.22'
                    }
                }
            }
        }
        EOF

    - name: Build Android APK
      run: |
        ANDROID_DIR="android"
        if [ ! -d "$ANDROID_DIR" ]; then
          ANDROID_DIR=$(find . -type d -name "android" | head -n 1)
        fi
        cd "$ANDROID_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/build/outputs/apk/debug/app-debug.apk'
